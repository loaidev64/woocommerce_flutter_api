name: woocommerce_flutter_api
description: A typed, null-safe Flutter/Dart client for the WooCommerce REST API. Manage products, orders, customers, coupons, taxes, shipping and more with pagination, typed exceptions and fake-data mode.
version: 2.0.0
repository: https://github.com/loaidev64/woocommerce_flutter_api.git
issue_tracker: https://github.com/loaidev64/woocommerce_flutter_api/issues
topics:
  - woocommerce
  - api
  - e-commerce
  - rest
  - http
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  meta: ^1.16.0
  dio: ^5.9.0
  faker: ^2.2.0
  flutter_secure_storage: ^11.0.0
  pretty_dio_logger: ^1.4.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
